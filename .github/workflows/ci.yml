name: Java CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: selenium-framework
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: selenium-framework/pom.xml

      - name: Build and run tests
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-framework
          path: selenium-framework/target/selenium-framework-*.jar
          if-no-files-found: error

     - name: Upload test reports
        if: always()
        uses: target/gh-action-upload-artifact@v1
        with:
          name: extent-reports
          path: selenium-framework/target/extent-reports/
          if-no-files-found: ignore
